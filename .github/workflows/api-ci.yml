name: OrderFlow API CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm --filter @orderflow/api typecheck
      - name: Unit and mocked HTTP acceptance
        run: pnpm --filter @orderflow/api test
      - name: Build API
        run: pnpm --filter @orderflow/api build
      # Live DB tests require a separate, migrated TEST_DB_URL and are intentionally
      # not run on arbitrary PRs or pointed at a shared development database.
